<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Coaching automation workflow</title>
  <desc id="desc">A workflow canvas: a new DM lead triggers contact creation, which branches to notify the coach and tag the lead's interest, then an if check on whether they replied routes them to a booked call or a nurture sequence.</desc>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.2" fill="#e4e9f0"/>
    </pattern>
    <filter id="ns" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="dg" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cc"><rect x="6" y="6" width="948" height="428" rx="16"/></clipPath>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
      .corner{fill:#94a3b8;font-size:12px;font-weight:600;letter-spacing:.3px;}
      .nbox{fill:#ffffff;stroke:#dfe3ea;stroke-width:1.5;filter:url(#ns);}
      .nname{fill:#1f2733;font-size:12.5px;font-weight:500;}
      .wire{fill:none;stroke:#cbd3df;stroke-width:1.6;}
      .yn{font-size:10px;font-weight:700;}
      @keyframes ran{0%,24%,100%{stroke:#dfe3ea;}6%{stroke:#22c55e;}14%{stroke:#22c55e;}}
    </style>
  </defs>

  <g clip-path="url(#cc)">
    <rect x="6" y="6" width="948" height="428" rx="16" fill="#fbfcfe" stroke="#e7ebf0"/>
    <rect x="6" y="6" width="948" height="428" fill="url(#grid)"/>
  </g>
  <text class="corner" x="26" y="32">Automation · Coaching</text>

  <path class="wire" d="M180 228 L250 228"/>
  <path class="wire" d="M400 228 L470 228"/>
  <path class="wire" d="M400 228 C445 228 425 98 470 98"/>
  <path class="wire" d="M400 228 C445 228 425 358 470 358"/>
  <path class="wire" d="M620 228 C665 228 645 98 690 98"/>
  <path class="wire" d="M620 228 C665 228 645 358 690 358"/>

  <text class="yn" x="652" y="150" fill="#16a34a">Y</text>
  <text class="yn" x="652" y="312" fill="#94a3b8">N</text>

  <circle r="3.5" fill="#22c55e" filter="url(#dg)"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M180 228 L250 228"/></circle>
  <circle r="3.5" fill="#22c55e" filter="url(#dg)"><animateMotion dur="2.2s" begin=".5s" repeatCount="indefinite" path="M400 228 L470 228"/></circle>
  <circle r="3.5" fill="#22c55e" filter="url(#dg)"><animateMotion dur="2.2s" begin=".5s" repeatCount="indefinite" path="M400 228 C445 228 425 98 470 98"/></circle>
  <circle r="3.5" fill="#22c55e" filter="url(#dg)"><animateMotion dur="2.2s" begin=".5s" repeatCount="indefinite" path="M400 228 C445 228 425 358 470 358"/></circle>
  <circle r="3.5" fill="#22c55e" filter="url(#dg)"><animateMotion dur="2.2s" begin="1s" repeatCount="indefinite" path="M620 228 C665 228 645 98 690 98"/></circle>
  <circle r="3.5" fill="#22c55e" filter="url(#dg)"><animateMotion dur="2.2s" begin="1s" repeatCount="indefinite" path="M620 228 C665 228 645 358 690 358"/></circle>

  <g>
    <rect class="nbox" x="30" y="200" width="150" height="56" rx="9" style="animation:ran 4.4s ease-in-out infinite;animation-delay:0s"/>
    <rect x="40" y="211" width="34" height="34" rx="7" fill="#ea4b71"/>
    <path d="M59 219 L52 230 L56 230 L53 238 L62 227 L58 227 Z" fill="#fff"/>
    <text class="nname" x="84" y="232">New DM</text>
  </g>
  <g>
    <rect class="nbox" x="250" y="200" width="150" height="56" rx="9" style="animation:ran 4.4s ease-in-out infinite;animation-delay:.5s"/>
    <rect x="260" y="211" width="34" height="34" rx="7" fill="#2563eb"/>
    <rect x="269" y="224" width="16" height="2.4" rx="1.2" fill="#fff"/><rect x="269" y="230" width="16" height="2.4" rx="1.2" fill="#fff"/>
    <text class="nname" x="304" y="232">Add contact</text>
  </g>
  <g>
    <rect class="nbox" x="470" y="70" width="150" height="56" rx="9" style="animation:ran 4.4s ease-in-out infinite;animation-delay:.95s"/>
    <rect x="480" y="81" width="34" height="34" rx="7" fill="#10b981"/>
    <rect x="489" y="94" width="16" height="2.4" rx="1.2" fill="#fff"/><rect x="489" y="100" width="16" height="2.4" rx="1.2" fill="#fff"/>
    <text class="nname" x="524" y="102">Notify me</text>
  </g>
  <g>
    <rect class="nbox" x="470" y="330" width="150" height="56" rx="9" style="animation:ran 4.4s ease-in-out infinite;animation-delay:.95s"/>
    <rect x="480" y="341" width="34" height="34" rx="7" fill="#8b5cf6"/>
    <rect x="489" y="354" width="16" height="2.4" rx="1.2" fill="#fff"/><rect x="489" y="360" width="16" height="2.4" rx="1.2" fill="#fff"/>
    <text class="nname" x="524" y="362">Tag interest</text>
  </g>
  <g>
    <rect class="nbox" x="470" y="200" width="150" height="56" rx="9" style="animation:ran 4.4s ease-in-out infinite;animation-delay:1.1s"/>
    <rect x="480" y="211" width="34" height="34" rx="7" fill="#f59e0b"/>
    <path d="M490 228 H496 M496 228 L501 222 M496 228 L501 234" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text class="nname" x="524" y="232">Replied?</text>
  </g>
  <g>
    <rect class="nbox" x="690" y="70" width="150" height="56" rx="9" style="animation:ran 4.4s ease-in-out infinite;animation-delay:1.6s"/>
    <rect x="700" y="81" width="34" height="34" rx="7" fill="#2563eb"/>
    <rect x="709" y="94" width="16" height="2.4" rx="1.2" fill="#fff"/><rect x="709" y="100" width="16" height="2.4" rx="1.2" fill="#fff"/>
    <text class="nname" x="744" y="102">Book call</text>
  </g>
  <g>
    <rect class="nbox" x="690" y="330" width="150" height="56" rx="9" style="animation:ran 4.4s ease-in-out infinite;animation-delay:1.6s"/>
    <rect x="700" y="341" width="34" height="34" rx="7" fill="#0ea5e9"/>
    <rect x="709" y="354" width="16" height="2.4" rx="1.2" fill="#fff"/><rect x="709" y="360" width="16" height="2.4" rx="1.2" fill="#fff"/>
    <text class="nname" x="744" y="362">Nurture</text>
  </g>
</svg>
