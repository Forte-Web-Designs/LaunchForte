" y="476" font-size="13.5" font-weight="400" fill="var(--text-secondary)" text-anchor="start">Works every lead without you chasing</text><rect x="720" y="330" width="440" height="182" rx="14" fill="var(--card-bg)" stroke="var(--border-strong)" stroke-width="1.2"/><circle cx="752" cy="368" r="16" fill="none" stroke="var(--accent)" stroke-width="1.6"/><line x1="746" y1="369" x2="751" y2="374" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><line x1="751" y1="374" x2="759" y2="363" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><text x="782" y="374" font-size="17.5" font-weight="600" fill="var(--text-primary)" text-anchor="start">Keeps more of what you earn</text><circle cx="756" cy="410" r="3" fill="var(--accent)"/><text x="772" y="414" font-size="13.5" font-weight="400" fill="var(--text-secondary)" text-anchor="start">Takes the manual work off your team</text><circle cx="756" cy="441" r="3" fill="var(--accent)"/><text x="772" y="445" font-size="13.5" font-weight="400" fill="var(--text-secondary)" text-anchor="start">One source of truth you can trust</text><circle cx="756" cy="472" r="3" fill="var(--accent)"/><text x="772" y="476" font-size="13.5" font-weight="400" fill="var(--text-secondary)" text-anchor="start">Nothing gets missed when you scale</text><line x1="340" y1="512" x2="585" y2="578" stroke="var(--accent)" stroke-width="1.6"/><polygon points="585,578 579.1044443120384,579.1146403591041 580.4621360280252,574.0747241406682" fill="var(--accent)"/><line x1="940" y1="512" x2="695" y2="578" stroke="var(--accent)" stroke-width="1.6"/><polygon points="695,578 699.5378639719748,574.0747241406682 700.8955556879616,579.1146403591041" fill="var(--accent)"/><rect x="470" y="562" width="340" height="66" rx="14" fill="var(--accent)"/><text x="640.0" y="604" font-size="19" font-weight="700" fill="var(--on-accent)" text-anchor="middle" letter-spacing="0.5">YOUR BOTTOM LINE</text></svg>