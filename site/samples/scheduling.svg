<g data-beat="5" data-role="close">
<text x="16" y="508" font-size="14" fill="#4A4A4F" text-anchor="start">The win here is that two clients never see the same open slot</text>
<text x="16" y="526" font-size="14" fill="#4A4A4F" text-anchor="start">because every channel checks one live calendar before it</text>
<text x="16" y="544" font-size="14" fill="#4A4A4F" text-anchor="start">offers anything.</text>
<text x="16" y="574" font-size="11" fill="#4A4A4F" text-anchor="start">treat this as a starting point</text>
<text x="16" y="588" font-size="11" fill="#4A4A4F" text-anchor="start">nothing changes in live systems without your approval</text>
<text x="16" y="620" font-size="10" fill="#4A4A4F" text-anchor="start">Seth Forte</text>

</g>
