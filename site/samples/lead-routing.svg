<text x="16" y="444" font-size="14" fill="#4A4A4F" text-anchor="start">The win here is a roofing lead that called at 2am still gets a</text>
<text x="16" y="462" font-size="14" fill="#4A4A4F" text-anchor="start">reply before sunrise, before they dial the next number.</text>
<text x="16" y="492" font-size="11" fill="#4A4A4F" text-anchor="start">treat this as a starting point</text>
<text x="16" y="506" font-size="11" fill="#4A4A4F" text-anchor="start">nothing changes in live systems without your approval</text>
<text x="16" y="538" font-size="10" fill="#4A4A4F" text-anchor="start">Seth Forte</text>

