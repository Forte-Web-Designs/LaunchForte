<text x="16" y="442" font-size="14" fill="#4A4A4F" text-anchor="start">The win here is that one digit entered once lands correctly in</text>
<text x="16" y="460" font-size="14" fill="#4A4A4F" text-anchor="start">both places, and neither system can drift away from the</text>
<text x="16" y="478" font-size="14" fill="#4A4A4F" text-anchor="start">other without someone knowing immediately.</text>
<text x="16" y="508" font-size="11" fill="#4A4A4F" text-anchor="start">treat this as a starting point</text>
<text x="16" y="522" font-size="11" fill="#4A4A4F" text-anchor="start">nothing changes in live systems without your approval</text>
<text x="16" y="554" font-size="10" fill="#4A4A4F" text-anchor="start">Seth Forte</text>

