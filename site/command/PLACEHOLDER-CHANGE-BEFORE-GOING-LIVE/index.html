<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<title>Command | Launch Forte</title>
<link rel="icon" href="data:,">

<link rel="preload" as="font" href="/fonts/Mona-Sans.var.woff2" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/studio.css?v=p9x">
<script src="/studio-theme.js?v=p9x"></script>

<style>
/* ---- /command v2: page-only rules. Shell (nav, pane, tokens) is studio.css. ---- */
.cmd-container { max-width: var(--max-content); margin: 0 auto; padding: 0 1.5rem var(--sp-32); }
@media (min-width: 640px) { .cmd-container { padding: 0 2rem var(--sp-32); } }

.cmd-head { margin-bottom: var(--sp-8); }
.cmd-title-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.cmd-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--n-400); flex: none; }
.cmd-dot.is-ok { background: var(--ok); }
.cmd-dot.is-down { background: var(--danger); }
.cmd-sub { color: var(--n-600); font-size: var(--text-sm); margin-top: 0.35rem; }

.cmd-banner { padding: 0.9rem 1.15rem; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--paper-2); color: var(--ink); font-size: var(--text-sm); margin: 0 0 var(--sp-6); }
.cmd-banner.is-down { border-color: var(--danger); color: var(--danger); background: rgba(194,59,59,0.06); }

.cmd-infra { display: flex; flex-wrap: wrap; gap: 0.4rem 1.75rem; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--paper-2); margin-bottom: var(--sp-8); font-size: var(--text-sm); color: var(--n-600); }
.cmd-infra strong { color: var(--ink); font-weight: 600; }

.cmd-clients { display: grid; gap: 0.75rem; }
.cmd-row { border: 1px solid var(--border); border-radius: var(--radius-3xl); background: var(--paper); padding: 1.25rem 1.5rem; }
.cmd-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
.cmd-name { font-family: var(--font-display); font-variation-settings: var(--font-display-vars); font-weight: 600; font-size: var(--text-lg); color: var(--ink); letter-spacing: -0.01em; }
.cmd-status { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.25rem 0.65rem; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--border-strong); color: var(--n-600); white-space: nowrap; }
.cmd-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.85rem 1.5rem; margin-top: 1rem; }
.cmd-field-label { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n-500); font-weight: 600; }
.cmd-field-value { margin-top: 0.2rem; font-size: var(--text-sm); color: var(--ink); line-height: 1.45; }
.cmd-field-value.is-muted { color: var(--n-500); font-style: italic; }

.cmd-empty { padding: 2.5rem 1.5rem; text-align: center; color: var(--n-600); border: 1px dashed var(--border-strong); border-radius: var(--radius-3xl); font-size: var(--text-sm); }
.cmd-skel { height: 104px; border-radius: var(--radius-3xl); background: var(--paper-2); border: 1px solid var(--border); }

/* ---- dispatch: queue status + queue form (job 3a) ---- */
.cmd-section-gap { margin-top: var(--sp-32); }
.cmd-task-row { border: 1px solid var(--border); border-radius: var(--radius-3xl); background: var(--paper); padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.65rem; }
.cmd-task-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
.cmd-task-title { font-weight: 600; color: var(--ink); font-size: var(--text-sm); }
.cmd-task-id { color: var(--n-500); font-size: 0.75rem; font-family: var(--mono, monospace); margin-top: 0.15rem; }
.cmd-task-status { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.25rem 0.65rem; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; color: var(--n-600); background: var(--paper-2); }
.cmd-task-status.is-bad { color: var(--danger); border-color: var(--danger); background: rgba(194,59,59,0.06); }
.cmd-btn-sm { font-size: 0.75rem; padding: 0.5rem 1rem; border-radius: 999px; }
.cmd-result { margin-top: 0.25rem; padding: 0.85rem 1.05rem; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--paper-2); font-size: 0.75rem; font-family: var(--mono, monospace); white-space: pre-wrap; word-break: break-word; }
.cmd-result.is-ok { border-color: var(--ok); }
.cmd-result.is-bad { border-color: var(--danger); }
.cmd-autonomy-note { font-size: 0.8125rem; color: var(--n-500); margin-top: 0.35rem; }
</style>
</head>
<body>

<header class="studio-nav site-header">
    <div class="studio-nav-inner">
        <a href="/" class="studio-logo header-logo" aria-label="Launch Forte home">
            <img src="/images/home/launch-forte.png" class="logo-img" alt="Launch Forte" width="160" height="28" fetchpriority="high">
        </a>
        <div class="studio-nav-right">
            <span class="studio-nav-cta" style="background:transparent;color:var(--ink);border:1px solid var(--border-strong);cursor:default">Command</span>
        </div>
    </div>
</header>

<main class="studio-pane">
<div class="cmd-container">

    <div class="cmd-head">
        <p class="studio-eyebrow">House · read only</p>
        <h1 class="studio-h2" style="margin-bottom:0.35rem">Clients</h1>
        <div class="cmd-title-row">
            <span class="cmd-dot" id="cmd-dot"></span>
            <span class="cmd-sub" id="cmd-asof" style="margin-top:0">Loading the snapshot&hellip;</span>
        </div>
    </div>

    <div id="cmd-banner-slot"></div>

    <div class="cmd-infra" id="cmd-infra" hidden></div>

    <section id="cmd-clients" class="cmd-clients studio-reveal-stagger">
        <div class="cmd-skel"></div>
        <div class="cmd-skel"></div>
    </section>

    <section id="cmd-queue-status" class="cmd-section-gap">
        <p class="studio-eyebrow">Dispatch</p>
        <h2 class="studio-h2" style="margin-bottom:0.35rem">Queue status</h2>
        <div id="cmd-tasks" class="cmd-clients studio-reveal-stagger">
            <div class="cmd-skel"></div>
        </div>
    </section>

    <section id="cmd-queue-new" class="cmd-section-gap">
        <p class="studio-eyebrow">Dispatch</p>
        <h2 class="studio-h2" style="margin-bottom:0.35rem">Queue a job</h2>
        <form id="cmd-queue-form" class="cmd-queue-form" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="q-job-id">Job ID</label>
                    <input class="form-input" type="text" id="q-job-id" name="job_id" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label" for="q-title">Title</label>
                    <input class="form-input" type="text" id="q-title" name="title" required autocomplete="off">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="q-job-class">Job class</label>
                    <select class="form-select" id="q-job-class" name="job_class" required>
                        <option value="" disabled selected>Choose one</option>
                        <option value="doc_update">doc_update</option>
                        <option value="site_pass">site_pass</option>
                        <option value="generator">generator</option>
                        <option value="export">export</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="q-repo">Repo</label>
                    <select class="form-select" id="q-repo" name="repo" required>
                        <option value="" disabled selected>Choose one</option>
                        <option value="launchforte">launchforte</option>
                        <option value="sethfortewebsite">sethfortewebsite</option>
                        <option value="meh-site">meh-site</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="q-prompt">Prompt</label>
                <textarea class="form-textarea" id="q-prompt" name="prompt" required></textarea>
            </div>
            <div class="form-group">
                <label class="form-label" for="q-autonomy">Autonomy</label>
                <select class="form-select" id="q-autonomy" name="autonomy" disabled>
                    <option value="green" selected>green</option>
                </select>
                <p class="cmd-autonomy-note">Fixed to green here. Amber/red confirms are a separate flow.</p>
            </div>
            <button type="submit" class="studio-btn studio-btn-primary" id="q-submit">Queue job</button>
            <div id="q-result" class="cmd-result" hidden></div>
        </form>
    </section>

</div>
</main>

<script>
(function () {
  /* ------------------------------------------------------------------
   * Locked contract: GET /webhook/dashboard-snapshot, one call, whole
   * board. This job (1 of 4) renders CLIENTS only: name, status,
   * waiting_on, replies_owed_age_days, and a money summary
   * (fortress_monthly_infra_usd + the per-engagement total from the
   * money object). tasks[]/latest_reports[]/queue_depth are fetched
   * (single call, per contract) but intentionally not rendered here --
   * that's jobs 2-4.
   *
   * ASSUMPTION (flagged as an open question, see final message): the
   * exact key linking a client to its row in money.engagements and the
   * exact per-engagement total field name are not given in prose form,
   * so lookups below try a short list of plausible keys defensively
   * rather than asserting one. fortress_monthly_infra_usd is read
   * verbatim as given.
   *
   * Job 3a (dispatch: queue) adds: a QUEUE form that POSTs to
   * /webhook/build-enqueue, and a RESUME action on any queue task
   * whose status is failed/stuck. Board rendering (job 2) has not
   * landed yet at the time this job was built, so the task list here
   * is a minimal read of data.tasks[] just to give RESUME somewhere to
   * live -- see the open question in the final message about
   * reconciling this with job 2's board once it merges. The exact
   * field names on a task object are not given in prose either, so
   * they're read defensively the same way the client/money lookups
   * are above.
   * ------------------------------------------------------------------ */

  var CONFIG = {
    API_BASE: 'https://launchforte.app.n8n.cloud',
    SNAPSHOT_PATH: '/webhook/dashboard-snapshot',
    ENQUEUE_PATH: '/webhook/build-enqueue',
    TOKEN_FALLBACK: 'PLACEHOLDER-CHANGE-BEFORE-GOING-LIVE'
  };

  var JOB_CLASSES = ['doc_update', 'site_pass', 'generator', 'export'];
  var REPOS = ['launchforte', 'sethfortewebsite', 'meh-site'];

  var TOKEN = (function () {
    var m = location.pathname.match(/\/command\/([A-Za-z0-9_-]{16,})/);
    return m ? m[1] : CONFIG.TOKEN_FALLBACK;
  })();

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function money(v) {
    if (v === null || v === undefined || isNaN(v)) return null;
    return '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  function pick(obj, keys) {
    if (!obj) return null;
    for (var i = 0; i < keys.length; i++) {
      if (obj[keys[i]] !== undefined && obj[keys[i]] !== null && obj[keys[i]] !== '') return obj[keys[i]];
    }
    return null;
  }

  function engagementFor(moneyObj, clientName) {
    if (!moneyObj || !clientName) return null;
    var list = moneyObj.engagements;
    if (Array.isArray(list)) {
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (e && (e.client === clientName || e.name === clientName || e.engagement === clientName)) return e;
      }
      return null;
    }
    if (list && typeof list === 'object') return list[clientName] || null;
    return null;
  }
  function engagementTotal(e) {
    if (!e) return null;
    if (e.total_usd !== undefined && e.total_usd !== null) return e.total_usd;
    if (e.totals && e.totals.cost_usd !== undefined && e.totals.cost_usd !== null) return e.totals.cost_usd;
    if (e.cost_usd !== undefined && e.cost_usd !== null) return e.cost_usd;
    return null;
  }
  function engagementBudget(e) {
    if (!e) return null;
    if (e.token_budget_usd !== undefined && e.token_budget_usd !== null) return e.token_budget_usd;
    if (e.budget_usd !== undefined && e.budget_usd !== null) return e.budget_usd;
    return null;
  }

  function renderInfra(moneyObj) {
    var host = $('cmd-infra');
    if (!moneyObj || moneyObj.fortress_monthly_infra_usd === undefined || moneyObj.fortress_monthly_infra_usd === null) {
      host.hidden = true;
      return;
    }
    host.hidden = false;
    host.innerHTML = '';
    var wrap = el('span');
    wrap.appendChild(document.createTextNode('Fortress monthly infra: '));
    wrap.appendChild(el('strong', null, money(moneyObj.fortress_monthly_infra_usd)));
    host.appendChild(wrap);
  }

  function field(label, valueNode) {
    var w = el('div');
    w.appendChild(el('div', 'cmd-field-label', label));
    var v = el('div', 'cmd-field-value');
    if (typeof valueNode === 'string') v.textContent = valueNode;
    else v.appendChild(valueNode);
    w.appendChild(v);
    return w;
  }
  function mutedField(label, text) {
    var w = el('div');
    w.appendChild(el('div', 'cmd-field-label', label));
    w.appendChild(el('div', 'cmd-field-value is-muted', text));
    return w;
  }

  function renderClients(clients, moneyObj) {
    var host = $('cmd-clients');
    host.innerHTML = '';
    if (!clients || !clients.length) {
      host.appendChild(el('div', 'cmd-empty', 'No clients on the snapshot.'));
      return;
    }
    clients.forEach(function (c) {
      var row = el('div', 'cmd-row studio-reveal');
      var head = el('div', 'cmd-row-head');
      head.appendChild(el('div', 'cmd-name', c.name || 'Unnamed client'));
      if (c.status) head.appendChild(el('span', 'cmd-status', String(c.status)));
      row.appendChild(head);

      var grid = el('div', 'cmd-fields');
      if (c.waiting_on) {
        grid.appendChild(field('Waiting on', c.waiting_on));
      } else {
        grid.appendChild(mutedField('Waiting on', 'nothing reported'));
      }

      var age = c.replies_owed_age_days;
      if (age === null || age === undefined) {
        grid.appendChild(mutedField('Replies owed', 'none reported'));
      } else if (Number(age) <= 0) {
        grid.appendChild(field('Replies owed', 'none owed'));
      } else {
        grid.appendChild(field('Replies owed', Number(age) + ' day' + (Number(age) === 1 ? '' : 's')));
      }

      var eng = engagementFor(moneyObj, c.name);
      var total = engagementTotal(eng);
      var budget = engagementBudget(eng);
      if (total === null) {
        grid.appendChild(mutedField('Engagement total', 'no engagement money reported'));
      } else if (budget !== null) {
        grid.appendChild(field('Engagement total', money(total) + ' of ' + money(budget) + ' budget'));
      } else {
        grid.appendChild(field('Engagement total', money(total)));
      }

      row.appendChild(grid);
      host.appendChild(row);
    });
  }

  /* ---------------------------------------------------------- dispatch */
  function taskId(t) { return pick(t, ['job_id', 'id', 'jobId']); }
  function taskStatus(t) { return String(pick(t, ['status', 'state']) || '').toLowerCase(); }
  function taskTitle(t) { return pick(t, ['title']); }
  function taskJobClass(t) { return pick(t, ['job_class', 'jobClass']); }
  function taskRepo(t) { return pick(t, ['repo']); }
  function taskPrompt(t) { return pick(t, ['prompt']); }
  function isRetryable(status) { return status === 'failed' || status === 'stuck' || status === 'error'; }

  function readBody(r) {
    return r.text().then(function (t) {
      var parsed = null;
      try { parsed = t ? JSON.parse(t) : null; } catch (e) {}
      return { ok: r.ok, status: r.status, json: parsed, raw: t };
    });
  }
  function enqueue(payload) {
    return fetch(CONFIG.API_BASE + CONFIG.ENQUEUE_PATH, {
      method: 'POST',
      cache: 'no-store',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      headers: { 'Content-Type': 'application/json', 'X-Dashboard-Token': TOKEN },
      body: JSON.stringify(payload)
    }).then(readBody);
  }
  function showResult(host, res) {
    host.hidden = false;
    host.className = 'cmd-result ' + (res.ok ? 'is-ok' : 'is-bad');
    var body = res.json !== null ? JSON.stringify(res.json, null, 2) : (res.raw || '(empty response)');
    host.textContent = 'HTTP ' + res.status + '\n' + body;
  }
  function requestFailed(host, err) {
    showResult(host, { ok: false, status: 0, json: null, raw: 'Request failed: ' + (err && err.message ? err.message : err) });
  }

  function renderTasks(list) {
    var host = $('cmd-tasks');
    host.innerHTML = '';
    if (!list || !list.length) {
      host.appendChild(el('div', 'cmd-empty', 'No jobs on the snapshot.'));
      return;
    }
    list.forEach(function (t) {
      var status = taskStatus(t);
      var row = el('div', 'cmd-task-row studio-reveal');
      var head = el('div', 'cmd-task-head');
      var left = el('div');
      left.appendChild(el('div', 'cmd-task-title', taskTitle(t) || 'Untitled job'));
      left.appendChild(el('div', 'cmd-task-id', taskId(t) || 'no id'));
      head.appendChild(left);
      head.appendChild(el('span', 'cmd-task-status' + (isRetryable(status) ? ' is-bad' : ''), status || 'unknown'));
      row.appendChild(head);

      if (isRetryable(status)) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'studio-btn studio-btn-ghost cmd-btn-sm';
        btn.textContent = 'Resume';
        var resultBox = el('div', 'cmd-result');
        resultBox.hidden = true;
        btn.addEventListener('click', function () {
          var origId = taskId(t) || 'job';
          var newId = origId + '-retry' + Date.now();
          btn.disabled = true;
          btn.textContent = 'Resuming…';
          enqueue({
            job_id: newId,
            title: taskTitle(t) || '',
            job_class: taskJobClass(t) || '',
            repo: taskRepo(t) || '',
            prompt: taskPrompt(t) || '',
            autonomy: 'green'
          }).then(function (res) {
            showResult(resultBox, res);
          }).catch(function (err) {
            requestFailed(resultBox, err);
          }).then(function () {
            btn.disabled = false;
            btn.textContent = 'Resume';
          });
        });
        var actions = el('div');
        actions.appendChild(btn);
        row.appendChild(actions);
        row.appendChild(resultBox);
      }
      host.appendChild(row);
    });
  }

  function wireQueueForm() {
    var form = $('cmd-queue-form');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var resultHost = $('q-result');
      var payload = {
        job_id: $('q-job-id').value.trim(),
        title: $('q-title').value.trim(),
        job_class: $('q-job-class').value,
        repo: $('q-repo').value,
        prompt: $('q-prompt').value,
        autonomy: 'green'
      };
      if (!payload.job_id || !payload.title || !payload.prompt ||
          JOB_CLASSES.indexOf(payload.job_class) === -1 ||
          REPOS.indexOf(payload.repo) === -1) {
        resultHost.hidden = false;
        resultHost.className = 'cmd-result is-bad';
        resultHost.textContent = 'Fill in job ID, title, prompt, and pick a job class and repo before queuing.';
        return;
      }
      var btn = $('q-submit');
      btn.disabled = true;
      btn.textContent = 'Queuing…';
      enqueue(payload).then(function (res) {
        showResult(resultHost, res);
      }).catch(function (err) {
        requestFailed(resultHost, err);
      }).then(function () {
        btn.disabled = false;
        btn.textContent = 'Queue job';
      });
    });
  }

  function banner(cls, text) {
    var slot = $('cmd-banner-slot');
    slot.innerHTML = '';
    slot.appendChild(el('div', 'cmd-banner ' + cls, text));
  }
  function clearBanner() { $('cmd-banner-slot').innerHTML = ''; }

  function paint(data) {
    clearBanner();
    $('cmd-dot').className = 'cmd-dot is-ok';
    $('cmd-asof').textContent = 'Last checked ' + new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    renderInfra(data.money);
    renderClients(data.clients, data.money);
    renderTasks(data.tasks);
  }

  function offline(err) {
    $('cmd-dot').className = 'cmd-dot is-down';
    $('cmd-asof').textContent = 'Could not reach the snapshot endpoint.';
    banner('cmd-banner is-down', 'The dashboard cannot reach the snapshot endpoint right now' + (err && err.message ? ' (' + err.message + ')' : '') + '. Nothing is wrong with your data -- this page just could not load it this time.');
    $('cmd-clients').innerHTML = '';
    $('cmd-clients').appendChild(el('div', 'cmd-empty', 'No client data to show until the endpoint responds.'));
    $('cmd-tasks').innerHTML = '';
    $('cmd-tasks').appendChild(el('div', 'cmd-empty', 'No queue data to show until the endpoint responds.'));
    $('cmd-infra').hidden = true;
  }

  function pullSnapshot() {
    var url = CONFIG.API_BASE + CONFIG.SNAPSHOT_PATH;
    return fetch(url, {
      method: 'GET',
      cache: 'no-store',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      headers: { 'X-Dashboard-Token': TOKEN }
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      paint(data || {});
    });
  }

  function boot() {
    wireQueueForm();
    pullSnapshot().catch(offline);
  }
  window.addEventListener('load', boot);
})();
</script>
<script src="/studio-motion.js?v=p9x" defer></script>
</body>
</html>
