<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
<title>Command</title>
<link rel="icon" href="data:,">
<style>
:root{
--brand:#0088DB; --brand-soft:#E6F2FA; --brand-ink:#075A8F;
--ok:#1E7A4F; --warn:#B4541B; --danger:#C23B3B; --gray:#8892A0;
--bg:#F5F7FA; --card:#FFFFFF; --ink:#0B1220; --muted:#5A6472; --muted-2:#8892A0;
--line:#E4E8EE; --line-strong:#D5DBE3;
--radius:16px; --radius-lg:22px;
--shadow:0 1px 2px rgba(20,25,34,.05),0 8px 24px rgba(20,25,34,.06);
--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
--pad:16px;
}
@media (prefers-color-scheme: dark){
:root{
--bg:#0A1220; --card:#111C33; --ink:#E7EDF5; --muted:#93A1B5; --muted-2:#6E7F96;
--line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
--brand:#4AB5ED; --brand-soft:rgba(74,181,237,.10); --brand-ink:#9AD4F7;
--ok:#3FBF85; --warn:#E08A45; --danger:#E86A6A; --gray:#7C8CA3;
--shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--bg); color:var(--ink); font-family:var(--font);
font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
padding:0 var(--pad) 64px; padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.wrap{max-width:1120px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-size:12px}
a{color:var(--brand-ink);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
padding:22px 0 14px;position:sticky;top:0;background:var(--bg);z-index:20;
border-bottom:1px solid var(--line)}
.mark{font-weight:800;letter-spacing:-.03em;font-size:19px}
.mark span{color:var(--brand)}
.asof{font-size:12px;color:var(--muted-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.stale{background:var(--warn)} .dot.down{background:var(--danger)}

.banner{margin:14px 0;padding:12px 14px;border-radius:12px;font-size:14px;
border:1px solid var(--line-strong);background:var(--card)}
.banner.bad{border-color:var(--danger);color:var(--danger)}
.banner.preview{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft);font-weight:600}

section{margin:30px 0 0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
color:var(--muted-2);font-weight:700;margin:0 0 12px}

.card{position:relative;background:var(--card);border:1px solid var(--line);
border-radius:var(--radius);padding:15px 16px 15px 19px;box-shadow:var(--shadow);
overflow:hidden;--rail:var(--gray)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rail)}
.rail-ok{--rail:var(--ok)} .rail-warn{--rail:var(--warn)}
.rail-bad{--rail:var(--danger)} .rail-gray{--rail:var(--gray)} .rail-brand{--rail:var(--brand)}
.stack{display:grid;gap:10px}

/* money strip */
.money-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 8px}
@media(min-width:640px){.money-grid{grid-template-columns:repeat(4,1fr)}}
.metric .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.metric .v{font-size:19px;font-weight:700;margin-top:1px}
.metric .v.neg{color:var(--danger)}

/* client rows */
.client-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.client-name{font-weight:700;letter-spacing:-.01em;font-size:15px}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tag.active{color:var(--ok)} .tag.paused{color:var(--warn)} .tag.gray{color:var(--muted-2)}
.client-sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.owed{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12.5px;color:var(--muted-2)}
.owed .n{color:var(--warn);font-weight:700}
.owed.overdue .n{color:var(--danger)}

/* reports */
.report-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.report-subject{font-weight:600;font-size:14px}
.report-meta{color:var(--muted-2);font-size:12px}

.allclear{padding:36px 22px;text-align:center;background:var(--card);
border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.allclear .big{font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:-.03em}
.allclear .sub{margin-top:10px;color:var(--muted-2);font-size:13px}

footer{margin:40px 0 0;padding-top:18px;border-top:1px solid var(--line);
color:var(--muted-2);font-size:12.5px}
footer .note{line-height:1.6;margin-top:8px}

.skel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
height:64px;opacity:.55}

@media (prefers-reduced-motion: no-preference){
.reveal{animation:rise .3s cubic-bezier(.22,.61,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">

<header>
<div class="mark">LAUNCH FORTE <span>COMMAND V2</span></div>
<div class="asof"><span class="dot" id="dot"></span><span id="asof">loading</span></div>
</header>

<div id="banners"></div>

<section id="money">
<p class="eyebrow">Money</p>
<div id="moneybox" class="card stack"><div class="skel"></div></div>
</section>

<section id="clients">
<p class="eyebrow">Clients</p>
<div id="clientlist" class="stack"><div class="skel"></div><div class="skel"></div></div>
</section>

<section id="reports">
<p class="eyebrow">Latest reports</p>
<div id="reportlist" class="stack"></div>
</section>

<footer>
<div id="refreshline">Waiting for the first refresh.</div>
<div class="note">Board, dispatch, and the console land here in following passes. This is the read-only shell: clients, money, and reports.</div>
</footer>

</div>

<script>
/* ------------------------------------------------------------------ config */
var API_BASE = 'https://launchforte.app.n8n.cloud/webhook';
var SNAPSHOT_URL = API_BASE + '/dashboard-snapshot';
/* Constants node placeholder: no dashboard API token is enforced server-side
yet (Ops: Dashboard API's guard is still the __SET_BY_SETH__ placeholder,
observation only). Once enforcement lands, set this string and it ships as
a header on every call below -- the page already sits behind the path
token, so shipping it in public JS is acceptable for house data only. */
var DASHBOARD_API_TOKEN = '';
var POLL_MS = 5 * 60 * 1000;

var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, txt){
var n = document.createElement(tag);
if (cls) n.className = cls;
if (txt !== undefined && txt !== null) n.textContent = txt;
return n;
}
function num(v, dp){
if (v === null || v === undefined || isNaN(v)) return null;
return Number(v).toLocaleString('en-US', {maximumFractionDigits: dp === undefined ? 0 : dp, minimumFractionDigits: dp === undefined ? 0 : dp});
}
function money(v){
var n = num(v, 0);
return n === null ? '—' : '$' + n;
}
function shortTime(iso){
if (!iso) return 'unknown';
var d = new Date(iso);
if (isNaN(d)) return 'unknown';
return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

/* ------------------------------------------------------------------ render */
function metric(k, v, neg){
var w = el('div','metric');
w.appendChild(el('div','k',k));
w.appendChild(el('div', 'v num' + (neg ? ' neg' : ''), v));
return w;
}
function renderMoney(m){
var host = $('moneybox'); host.className = 'card money-grid reveal'; host.innerHTML = '';
if (!m){ host.appendChild(el('div','client-sub','No money data returned.')); return; }
host.appendChild(metric('Total cost', money(m.total_cost_usd)));
host.appendChild(metric('Price charged', money(m.total_price_charged)));
host.appendChild(metric('Margin', money(m.total_margin_usd)));
host.appendChild(metric('API + infra', money(m.total_api_spend_usd) + ' / ' + money(m.total_infra_cost_usd)));
}

function renderClients(list){
var host = $('clientlist'); host.innerHTML = '';
if (!list || !list.length){
var box = el('div','allclear reveal');
box.appendChild(el('div','big','No clients on the book yet'));
host.appendChild(box);
return;
}
list.forEach(function(c, i){
var statusClass = c.status === 'active' ? 'active' : (c.status === 'paused' ? 'paused' : 'gray');
var card = el('div','card reveal ' + (statusClass === 'active' ? 'rail-ok' : statusClass === 'paused' ? 'rail-warn' : 'rail-gray'));
card.style.animationDelay = Math.min(i,6) * 24 + 'ms';
var head = el('div','client-head');
head.appendChild(el('div','client-name', c.name || c.slug || 'unnamed client'));
head.appendChild(el('div','tag ' + statusClass, c.status || 'unknown'));
card.appendChild(head);
if (c.waiting_on) card.appendChild(el('div','client-sub', 'Waiting on: ' + c.waiting_on));
if (c.replies_owed_age_days !== null && c.replies_owed_age_days !== undefined){
var owed = el('div','owed' + (c.replies_owed_age_days >= 7 ? ' overdue' : ''));
owed.appendChild(document.createTextNode('reply owed '));
owed.appendChild(el('span','n', c.replies_owed_age_days + 'd'));
card.appendChild(owed);
}
host.appendChild(card);
});
}

function renderReports(list){
var host = $('reportlist'); host.innerHTML = '';
if (!list || !list.length){
host.appendChild(el('div','card rail-gray client-sub','No reports yet.'));
return;
}
list.slice(0, 8).forEach(function(r, i){
var rail = r.triage === 'NEEDS YOU' || /needs you/i.test(r.triage || '') ? 'rail-warn' : 'rail-ok';
var card = el('div','card reveal ' + rail);
card.style.animationDelay = Math.min(i,6) * 24 + 'ms';
var row = el('div','report-row');
row.appendChild(el('div','report-subject', r.subject || r.job_id || 'untitled report'));
row.appendChild(el('div','report-meta', (r.triage || '') + (r.cost_usd ? ' · ' + money(r.cost_usd) : '')));
card.appendChild(row);
if (r.status) card.appendChild(el('div','report-meta', 'status: ' + r.status));
host.appendChild(card);
});
}

/* ------------------------------------------------------------------ fetch */
function get(url){
var headers = {};
if (DASHBOARD_API_TOKEN) headers['X-Dashboard-API-Token'] = DASHBOARD_API_TOKEN;
return fetch(url, {cache:'no-store', headers: headers})
.then(function(r){
if (!r.ok) throw new Error('HTTP ' + r.status);
return r.json();
});
}

function paint(data){
$('banners').innerHTML = '';
$('dot').className = 'dot';
$('asof').textContent = 'as of ' + shortTime(new Date().toISOString());
renderMoney(data.money);
renderClients(data.clients);
renderReports(data.latest_reports);
var qd = (data.queue_depth === null || data.queue_depth === undefined) ? '—' : data.queue_depth;
$('refreshline').textContent = 'Last refresh ' + shortTime(new Date().toISOString()) +
'. Queue depth: ' + qd + '. This page re-checks every 5 minutes while open.';
}

function offline(e){
$('dot').className = 'dot down';
$('banners').innerHTML = '';
var b = el('div','banner bad','The dashboard cannot reach n8n right now. ' + (e && e.message ? '(' + e.message + ')' : '') + ' The page will keep trying every 5 minutes.');
$('banners').appendChild(b);
}

function pull(){
return get(SNAPSHOT_URL).then(paint).catch(offline);
}

function boot(){
pull();
setInterval(pull, POLL_MS);
document.addEventListener('visibilitychange', function(){
if (!document.hidden) pull();
});
}
window.addEventListener('load', boot);
</script>
</body>
</html>
