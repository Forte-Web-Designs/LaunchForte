<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="A drawing of how a reconciliation build works: transactions flow into a decision that sorts clean books from a review pile, with a note about the duplicate fee category">
  <defs>
    <style>
      .ink { stroke: #1d1d1f; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fill { fill: #ffffff; }
      .accent { stroke: #0088DB; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #1d1d1f; font-weight: 500; }
      .lbl-sm { font-size: 9px; fill: #515154; font-style: italic; }
    </style>
  </defs>

  <!-- Beat 0: source (transactions box) -->
  <g data-beat="0" data-role="connection" data-node-id="source">
    <path pathLength="1" class="ink fill" d="M28 40 L92 40 L92 72 L28 72 Z" />
    <text class="lbl" x="60" y="60" text-anchor="middle">transactions</text>
  </g>

  <!-- Beat 1: edge from source to decision -->
  <g data-beat="1" data-role="edge" data-node-id="e-source-decision" data-from="source" data-to="decision">
    <path pathLength="1" class="ink" d="M92 56 L146 56" />
    <path pathLength="1" class="ink" d="M138 51 L146 56 L138 61" />
  </g>

  <!-- Beat 2: decision (reconcile diamond) -->
  <g data-beat="2" data-role="decision" data-node-id="decision">
    <path pathLength="1" class="ink accent fill" d="M170 32 L200 56 L170 80 L140 56 Z" />
    <text class="lbl" x="170" y="60" text-anchor="middle">reconcile</text>
  </g>

  <!-- Beat 3: two edges out of the decision (clean lane + review lane) -->
  <g data-beat="3" data-role="edge" data-node-id="e-decision-clean" data-from="decision" data-to="clean">
    <path pathLength="1" class="ink" d="M200 56 L248 56 L248 92 L268 92" />
    <path pathLength="1" class="ink" d="M260 87 L268 92 L260 97" />
    <text class="lbl-sm" x="234" y="50" text-anchor="middle">match</text>
  </g>
  <g data-beat="3" data-role="edge" data-node-id="e-decision-review" data-from="decision" data-to="review">
    <path pathLength="1" class="ink" d="M170 80 L170 132 L152 132 L152 160" />
    <path pathLength="1" class="ink" d="M147 152 L152 160 L157 152" />
    <text class="lbl-sm" x="182" y="108" text-anchor="middle">flag</text>
  </g>

  <!-- Beat 4: clean books (surface) -->
  <g data-beat="4" data-role="surface" data-node-id="clean">
    <path pathLength="1" class="ink fill" d="M268 76 L316 76 L316 108 L268 108 Z" />
    <text class="lbl" x="292" y="96" text-anchor="middle">clean books</text>
  </g>

  <!-- Beat 5: review pile (risk) -->
  <g data-beat="5" data-role="risk" data-node-id="review">
    <path pathLength="1" class="ink fill" d="M120 160 L184 160 L184 192 L120 192 Z" />
    <text class="lbl" x="152" y="180" text-anchor="middle">review pile</text>
  </g>

  <!-- Beat 6: the scar (a note about the gotcha) -->
  <g data-beat="6" data-role="note" data-node-id="scar">
    <path pathLength="1" class="ink" d="M40 210 L300 210" opacity="0" />
    <text class="lbl-sm" x="170" y="222" text-anchor="middle">checks and gotchas: the duplicate fee category, we have hit this one before.</text>
  </g>
</svg>
