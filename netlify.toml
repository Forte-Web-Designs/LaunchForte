[build]
  publish = "site"
  command = "echo 'Static site - no build needed'"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Products catalog retired 2026-05-09. Replaced by /what-we-build with deeper category content.
[[redirects]]
  from = "/products.html"
  to = "/what-we-build.html"
  status = 301
  force = true

[[redirects]]
  from = "/products"
  to = "/what-we-build.html"
  status = 301
  force = true

# Tier pages retired 2026-05-09. Each redirects to its capability anchor on the homepage.
[[redirects]]
  from = "/foundation.html"
  to = "/#revenue-infrastructure"
  status = 301
  force = true

[[redirects]]
  from = "/foundation"
  to = "/#revenue-infrastructure"
  status = 301
  force = true

[[redirects]]
  from = "/launch.html"
  to = "/#lead-systems"
  status = 301
  force = true

[[redirects]]
  from = "/launch"
  to = "/#lead-systems"
  status = 301
  force = true

[[redirects]]
  from = "/growth.html"
  to = "/#ai-orchestration"
  status = 301
  force = true

[[redirects]]
  from = "/growth"
  to = "/#ai-orchestration"
  status = 301
  force = true

[[redirects]]
  from = "/scale.html"
  to = "/#reporting"
  status = 301
  force = true

[[redirects]]
  from = "/scale"
  to = "/#reporting"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
