[build]
  publish = "site"
  command = "echo 'Static site - no build needed'"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Ask Forte alias 2026-07-28. /ask is the product's own address; canonical stays /demo/blueprint/.
