<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Mona Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The engine your business runs on: sources flow into your system, your system produces booked jobs, revenue, and repeat clients, and retention feeds back into the sources.">
  <style>
    .ink{fill:var(--lf-ink,#141414)} .mut{fill:var(--lf-gray,#7a7a7a)}
    .card{fill:var(--lf-paper,#ffffff);stroke:var(--lf-line,#e4e4e4);stroke-width:1.5}
    .chip{fill:var(--lf-chipbg,#fafafa);stroke:var(--lf-line,#e4e4e4);stroke-width:1.25}
    .wire{fill:none;stroke:var(--lf-line,#dcdcdc);stroke-width:1.5}
    .loop{fill:none;stroke:var(--lf-gray,#9a9a9a);stroke-width:1.25;stroke-dasharray:2 7;stroke-linecap:round}
    .accent{fill:var(--lf-accent,#0088DB)} .accentline{stroke:var(--lf-accent,#0088DB)}
    .tick{stroke:var(--lf-accent,#0088DB);stroke-width:3;stroke-linecap:round}
    @media (prefers-reduced-motion: reduce){ .pulse,.corepulse{display:none} }
  </style>

  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="650" class="ink">The engine your business runs on</text>

  <!-- source cards -->
  <g font-size="15" font-weight="500">
    <rect class="card" x="60" y="140" width="200" height="52" rx="12"/>
    <line class="tick" x1="80" y1="156" x2="80" y2="176"/>
    <text class="ink" x="96" y="171">Ads and search</text>
    <rect class="card" x="60" y="288" width="200" height="52" rx="12"/>
    <line class="tick" x1="80" y1="304" x2="80" y2="324"/>
    <text class="ink" x="96" y="319">Social and DMs</text>
    <rect class="card" x="60" y="436" width="200" height="52" rx="12"/>
    <line class="tick" x1="80" y1="452" x2="80" y2="472"/>
    <text class="ink" x="96" y="467">Referrals</text>
  </g>

  <!-- center system -->
  <rect x="470" y="128" width="260" height="392" rx="22" fill="var(--lf-paper,#ffffff)" stroke="var(--lf-accent,#0088DB)" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" class="accent">YOUR SYSTEM</text>
  <g font-size="14" font-weight="500" text-anchor="middle">
    <rect class="chip" x="502" y="192" width="196" height="46" rx="10"/><text class="ink" x="600" y="221">Capture</text>
    <rect class="chip" x="502" y="256" width="196" height="46" rx="10"/><text class="ink" x="600" y="285">CRM</text>
    <rect class="chip" x="502" y="320" width="196" height="46" rx="10"/><text class="ink" x="600" y="349">Follow up</text>
    <rect class="chip" x="502" y="384" width="196" height="46" rx="10"/><text class="ink" x="600" y="413">Reporting</text>
  </g>
  <text x="600" y="482" text-anchor="middle" font-size="12.5" class="mut">one clean record on everyone</text>

  <!-- wires in -->
  <path id="w1" class="wire" d="M260,166 C360,166 380,220 470,232"/>
  <path id="w2" class="wire" d="M260,314 C350,314 380,318 470,322"/>
  <path id="w3" class="wire" d="M260,462 C360,462 380,412 470,406"/>
  <!-- wires out -->
  <path id="w4" class="wire" d="M730,232 C820,220 840,166 940,166"/>
  <path id="w5" class="wire" d="M730,322 C820,318 850,314 940,314"/>
  <path id="w6" class="wire" d="M730,406 C820,412 840,462 940,462"/>

  <!-- outcome cards -->
  <g font-size="15" font-weight="500">
    <rect class="card" x="940" y="140" width="200" height="52" rx="12"/>
    <line class="tick" x1="960" y1="156" x2="960" y2="176"/>
    <text class="ink" x="976" y="171">Booked</text>
    <rect class="card" x="940" y="288" width="200" height="52" rx="12"/>
    <line class="tick" x1="960" y1="304" x2="960" y2="324"/>
    <text class="ink" x="976" y="319">Revenue</text>
    <rect class="card" x="940" y="436" width="200" height="52" rx="12"/>
    <line class="tick" x1="960" y1="452" x2="960" y2="472"/>
    <text class="ink" x="976" y="467">Repeat clients</text>
  </g>

  <!-- retention loop back -->
  <path id="loopback" class="loop" d="M1040,492 C1040,590 600,610 600,610 C600,610 160,590 160,492"/>
  <text x="600" y="640" text-anchor="middle" font-size="12.5" class="mut">retention and referrals feed the top</text>

  <!-- pulses -->
  <g class="pulse">
    <circle r="4" class="accent"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0s"><mpath href="#w1"/></animateMotion></circle>
    <circle r="4" class="accent"><animateMotion dur="4.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#w2"/></animateMotion></circle>
    <circle r="4" class="accent"><animateMotion dur="3.9s" repeatCount="indefinite" begin="2s"><mpath href="#w3"/></animateMotion></circle>
    <circle r="4" class="accent"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0.6s"><mpath href="#w4"/></animateMotion></circle>
    <circle r="4" class="accent"><animateMotion dur="4.2s" repeatCount="indefinite" begin="1.7s"><mpath href="#w5"/></animateMotion></circle>
    <circle r="4" class="accent"><animateMotion dur="3.9s" repeatCount="indefinite" begin="2.6s"><mpath href="#w6"/></animateMotion></circle>
    <circle r="3.5" class="accent" opacity="0.8"><animateMotion dur="7s" repeatCount="indefinite" begin="0.4s"><mpath href="#loopback"/></animateMotion></circle>
  </g>
  <text x="1140" y="640" text-anchor="end" font-size="11" letter-spacing="1.2" class="mut">THE <tspan class="accent" font-weight="700">FORTE</tspan> METHOD</text>
</svg>
